spring.application.name=usuarios
# Railway asigna el puerto en la variable PORT
server.port=${PORT:8080}
# Respeta X-Forwarded-Proto del proxy de Railway (Swagger genera URLs https)
server.forward-headers-strategy=framework

# PostgreSQL 14.x o superior (Neon). Las credenciales se leen de variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA (el esquema lo crea db/script_bd.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# No exponer detalles internos en los errores
server.error.include-stacktrace=never
server.error.include-message=never

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Paginacion del listado general (GET /api/v1/usuarios)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
